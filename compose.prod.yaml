name: social-git

x-security: &security
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1770
  pids_limit: 128
  ulimits:
    nofile:
      soft: 1024
      hard: 2048
  restart: unless-stopped

services:
  core:
    <<: *security
    image: ${SOCIAL_GIT_IMAGE:?Set SOCIAL_GIT_IMAGE to an immutable image reference}
    command:
      - core
    environment:
      SOCIAL_GIT_DATABASE_PATH: /var/lib/social-git/social-git.sqlite3
      SOCIAL_GIT_PORT: "8080"
      SOCIAL_GIT_SESSION_KEY_FILE: /run/secrets/social_git_session_key
    secrets:
      - source: social_git_session_key
        target: social_git_session_key
    volumes:
      - social-git-data:/var/lib/social-git
    ports:
      - ${SOCIAL_GIT_BIND_ADDRESS:-127.0.0.1}:${SOCIAL_GIT_PORT:-8080}:8080
    networks:
      - api
      - worker-boundary
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.healthcheck", "--path", "/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    cpus: "2.0"
    mem_limit: 768m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 128M

  reddit-worker:
    <<: *security
    image: ${SOCIAL_GIT_IMAGE:?Set SOCIAL_GIT_IMAGE to an immutable image reference}
    command:
      - worker
    environment:
      SOCIAL_GIT_PORT: "8081"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - worker-boundary
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.healthcheck", "--path", "/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    cpus: "1.0"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 64M

networks:
  api: {}
  worker-boundary:
    internal: true

volumes:
  social-git-data: {}

secrets:
  social_git_session_key:
    file: ${SOCIAL_GIT_SESSION_KEY_FILE:?Set SOCIAL_GIT_SESSION_KEY_FILE to a secret file}
